services:
  formula-postgres:
    image: postgres:16
    container_name: formula-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: formula
    ports:
      # Host 15432 → container 5432. (55433 is in Windows Hyper-V excluded ranges; 5433 often taken.)
      - "15432:5432"
    volumes:
      - formula_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d formula"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  formula_pgdata: {}
